plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'EduReserve'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'EduReserve.jar'
}

checkstyle {
    toolVersion = '14.1.0'
}

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Keep the booking/history commands and persistence fully exercised, including lazy log messages.
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'CLASS'
            includes = ['command.BookCommand', 'command.UndoCommand*', 'command.RedoCommand', 'storage.Storage']
            ['INSTRUCTION', 'LINE', 'BRANCH'].each { metric ->
                limit {
                    counter = metric
                    minimum = 1.0
                }
            }
        }
        // Shared classes also serve unrelated commands; enforce only the methods used by this flow.
        rule {
            element = 'METHOD'
            includes = ['ui.Parser.parseBooking*', 'ui.Parser.parseCommand*', 'ui.Parser.separateInput*',
                        'ui.Parser.extractTrailingAttendeeField*', 'ui.Parser.parsePositiveAttendeeCount*',
                        'EduReserve.main*', 'EduReserve.printSaveTime*']
            ['INSTRUCTION', 'LINE', 'BRANCH'].each { metric ->
                limit {
                    counter = metric
                    minimum = 1.0
                }
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

run {
    enableAssertions = true
    standardInput = System.in
}
